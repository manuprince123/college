name: 🚀 Deploy College Management System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  AWS_REGION: ap-south-1

jobs:
  # =====================================================
  # JOB 1: Test Backend
  # =====================================================
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: college_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install backend dependencies
        run: |
          cd server
          npm ci

      - name: 🗄️ Run database migrations (test)
        run: |
          mysql -h 127.0.0.1 -u root -ptestpass college_test_db < database/schema.sql
        continue-on-error: true

      - name: 🧪 Run backend tests
        run: |
          cd server
          npm test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: testpass
          DB_NAME: college_test_db
          JWT_SECRET: test_jwt_secret_for_ci_testing_only

  # =====================================================
  # JOB 2: Test & Build Frontend
  # =====================================================
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Validate HTML files
        run: |
          echo "✅ index.html exists"
          ls -la index.html js/

      - name: 📊 Code quality check
        run: |
          echo "Total JS files: $(ls js/*.js | wc -l)"
          echo "Total lines: $(cat js/*.js | wc -l)"

  # =====================================================
  # JOB 3: Deploy Backend to EC2
  # =====================================================
  deploy-backend:
    name: 🚀 Deploy Backend (EC2)
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          script: |
            echo "📡 Connected to EC2..."
            
            # Navigate to project
            cd ~/college-management-system
            
            # Pull latest changes
            git fetch origin
            git checkout main
            git pull origin main
            
            # Install/update backend dependencies
            cd server
            npm install --production
            
            # Restart application with PM2
            pm2 restart college-api || pm2 start index.js --name "college-api"
            
            # Show status
            pm2 status
            echo "✅ Backend deployed successfully!"

  # =====================================================
  # JOB 4: Deploy Frontend to S3
  # =====================================================
  deploy-frontend-s3:
    name: 🌐 Deploy Frontend (S3)
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📤 Upload to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} \
            --exclude ".git/*" \
            --exclude "server/*" \
            --exclude "database/*" \
            --exclude "docs/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude ".env*" \
            --delete
          echo "✅ Frontend uploaded to S3!"

      - name: 🔄 Invalidate CloudFront Cache
        if: ${{ secrets.CF_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ CloudFront cache invalidated!"

      - name: 📣 Deployment Summary
        run: |
          echo "========================================"
          echo "✅ DEPLOYMENT COMPLETE!"
          echo "========================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "========================================"

  # =====================================================
  # JOB 5: Notify on Failure
  # =====================================================
  notify-failure:
    name: 📬 Notify on Failure
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend-s3]
    if: failure()

    steps:
      - name: 🚨 Send failure notification
        run: |
          echo "⚠️ Deployment failed for commit ${{ github.sha }}"
          echo "Check GitHub Actions logs for details"
          # Add Slack/email notification here if needed
